plugins {
    id 'atlas-web-app.java-conventions'
    id 'war'
    id 'org.flywaydb.flyway' version '7.14.0'
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
    id "io.spring.dependency-management" version "1.0.6.RELEASE"
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.security:spring-security-bom:5.1.5.RELEASE'
        mavenBom 'org.springframework:spring-framework-bom:5.1.6.RELEASE'
    }
}

gitProperties {
    gitPropertiesName = "resources/git.properties"
}

war {
    // Let's clean the exploded WAR if it's there
    def destinationPath = '../webapps'
    def artifactName = 'gxa'
    doFirst {
        delete "${destinationPath}/${artifactName}"
    }

    archiveFileName = "${artifactName}.war"
    destinationDirectory = file "${destinationPath}"

    manifest {
        def buildNumberValue = project.findProperty('buildNumber') ?: ''
        attributes(
                'Implementation-Title': artifactName,
                'Implementation-Version': project.version.toString(),
                'Built-By': System.getProperty('user.name'),
                'Build-Jdk': "${System.getProperty('java.version')} (${System.getProperty('java.vendor')})",
                'Gradle-Version': org.gradle.util.GradleVersion.current().version,
                'Build-Number': buildNumberValue.toString()
        )
    }
}

def cache2kVersion = '1.2.4.Final'
dependencies {
    implementation project(':atlas-web-core')

    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-webmvc'

    implementation "org.springframework.security:spring-security-web"
    implementation "org.springframework.security:spring-security-config"

    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'commons-net:commons-net:3.8.0'

    implementation "org.cache2k:cache2k-api:${cache2kVersion}"
    runtimeOnly "org.cache2k:cache2k-core:${cache2kVersion}"
    implementation "org.cache2k:cache2k-spring:${cache2kVersion}"

    implementation 'org.thymeleaf:thymeleaf:3.1.2.RELEASE'
    implementation 'org.thymeleaf:thymeleaf-spring5:3.1.2.RELEASE'

    // For URL rewrite (see WEB-INF/web.xml), or your Filter will fail with the most confusing error messages
    runtimeOnly 'org.tuckey:urlrewritefilter:4.0.3'

    testImplementation 'commons-beanutils:commons-beanutils:1.9.3'

    testImplementation 'com.zaxxer:HikariCP:3.3.1'
}

// Convenience tasks for running different categories of tests from the `app` module

tasks.register('utTests', Test) {
    description = 'Runs app unit tests (*Test).'
    group = 'verification'

    // Reuse the standard test sources and classpath
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Only run classes that end with 'Test'
    useJUnitPlatform()
    filter {
        includeTestsMatching '*Test'
    }
}

tasks.register('itTests', Test) {
    description = 'Runs app integration tests (*IT) excluding *WIT.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching '*IT'
    }
    // Match the CLI flag -PexcludeTests=**/*WIT.class
    exclude '**/*WIT.class'
}

tasks.register('e2eTests', Test) {
    description = 'Runs app end-to-end tests (*WIT).'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching '*WIT'
    }
}
