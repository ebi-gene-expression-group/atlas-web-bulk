<div id="experiments"></div>

<script defer th:src="@{/resources/js-bundles/experimentTable.bundle.js}"></script>

<script th:inline="javascript" th:with="contextPath=@{/}">
    const contextPath = /*[[${contextPath}]]*/ '';
    document.addEventListener('DOMContentLoaded', function() {
      experimentTable.renderRouter(
        {
          tableHeaders: [
            {
              label: 'Type',
              dataKey: 'experimentType',
              sortable: true,
              width: 0.5,
              image: {
                Differential: {
                  src: contextPath + 'resources/images/experiments-table/differential.png',
                  alt: 'Differential experiment',
                  title: 'Differential experiment'
                },
                Baseline: {
                  src: contextPath + 'resources/images/experiments-table/baseline.png',
                  alt: 'Baseline experiment',
                  title: 'Baseline experiment'
                }
              },
              linkTo: function(dataRow) { return contextPath + 'experiments?experimentType=' + dataRow.experimentType.toLowerCase(); }
            },
            {
              label: 'Load date',
              dataKey: 'loadDate',
              sortable: true,
              width: 0.5
            },
            {
              label: 'Species',
              dataKey: 'species',
              searchable: true,
              sortable: true
            },
            {
              label: 'Title',
              dataKey: 'experimentDescription',
              searchable: true,
              sortable: true,
              linkTo: function(dataRow) { return 'experiments/' + dataRow.experimentAccession + '/Results'; },
              width: 2
            },
            {
              label: 'Assays',
              dataKey: 'numberOfAssays',
              sortable: true,
              linkTo: function(dataRow) { return 'experiments/' + dataRow.experimentAccession + '/Experiment%20Design'; },
              width: 0.5
            },
            {
              label: 'Experimental factors',
              dataKey: 'experimentalFactors',
              searchable: true,
              linkTo: function(dataRow) { return 'experiments/' + dataRow.experimentAccession + '/Experiment%20Design'; }
            },
            {
              label: 'Technology',
              dataKey: 'technologyType',
              sortable: false
            }
          ],
          dropdownFilters: [
            {
              label: 'Kingdom',
              dataKey: 'kingdom'
            },
            {
              label: 'Experiment Type',
              dataKey: 'experimentType'
            },
            {
                label: 'Technology',
                dataKey: 'technologyType'
            }
          ],
          rowSelectionColumn: {
            label: 'Download',
            dataKey: 'experimentAccession',
            tableHeaderCellOnClick: experimentTable._validateAndDownloadExperimentFiles(contextPath),
            tooltipContent:
              '<ul>' +
              '<li>Expression matrices in TPMs or log<sub>2</sub>fold-change</li>' +
              '<li>Experiment design file with experimental metadata</li>' +
              '</ul>',
            width: 0.75
          },
          basename: contextPath,
          host: contextPath,
          resource: 'json/experiments'
        },
        'experiments');
    });
</script>
