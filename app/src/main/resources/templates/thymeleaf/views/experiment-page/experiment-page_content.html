<div th:replace="~{views/experiment-page/experiment-description}"></div>

<link rel="stylesheet" th:href="@{/resources/css/experiment.css}">
<link rel="stylesheet" th:href="@{/resources/css/alt-customized-bootstrap-3.3.5.css}">

<div class="row expanded margin-top-large">
    <div class="small-12 columns">
        <div id="experiment-page" ></div>
    </div>
</div>

<div id="feedback-button">
</div>

<link rel="stylesheet" th:href="@{/resources/css/react-popup.css}" type="text/css" media="all">
<script defer th:src="@{/resources/js-bundles/feedbackForm.bundle.js}"></script>

<script defer th:src="@{/resources/js-bundles/experimentPage.bundle.js}"></script>

<script th:inline="javascript" th:with="contextPath=@{/}">
  document.addEventListener("DOMContentLoaded", function() {
    experimentPage.render({
      atlasUrl: '[(@{/})]',
      content: /*[(${experimentContent})]*/ {},
      target: 'experiment-page'
    });
    feedbackForm.render({
      feedbackFormLink: 'https://www.ebi.ac.uk/support/gxa',
      gaId: 'UA-37676851-1'
    }, 'feedback-button');
  });
</script>
