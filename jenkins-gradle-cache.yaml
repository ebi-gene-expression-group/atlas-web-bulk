# This pod is used to seed the gradle dependencies cache
apiVersion: v1
kind: Pod
metadata:
  namespace: gxa-jenkins
spec:
  serviceAccountName: jenkins-cloud
  containers:
    - name: gradle-dep-cache-seed
      image: eclipse-temurin:11
      # Match jnlp workspace ownership (uid 1000). Codon NFS readable via pod
      # supplementalGroups fg_atlas (1146).
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      resources:
        requests:
          memory: "2.5Gi"
          cpu: "500m"
          ephemeral-storage: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      envFrom:
        - configMapRef:
            name: ebi-proxy
      env:
      # gradlew passes GRADLE_OPTS to java via unquoted eval; proxy host/port here
      # (no pipes). http.nonProxyHosts with | belongs in JAVA_TOOL_OPTIONS only.
      - name: GRADLE_OPTS
        value: >-
          -Dorg.gradle.daemon=false
          -Dorg.gradle.workers.max=4
          -Dhttp.proxyHost=$(PROXY_HOST)
          -Dhttp.proxyPort=$(PROXY_PORT)
          -Dhttps.proxyHost=$(PROXY_HOST)
          -Dhttps.proxyPort=$(PROXY_PORT)
      - name: GRADLE_USER_HOME
        value: "/tmp/gradle"
      - name: npm_config_cache
        value: "/npm-cache"
      - name: JAVA_TOOL_OPTIONS
        value: >-
          -Dhttp.proxyHost=$(PROXY_HOST)
          -Dhttp.proxyPort=$(PROXY_PORT)
          -Dhttps.proxyHost=$(PROXY_HOST)
          -Dhttps.proxyPort=$(PROXY_PORT)
          -Dhttp.nonProxyHosts=$(HTTP_NON_PROXY_HOSTS)
      command: ["sleep", "infinity"]
      volumeMounts:
        - mountPath: /gradle-ro-dep-cache
          name: gradle-ro-dep-cache
          readOnly: false
  volumes:
    - name: gradle-ro-dep-cache
      persistentVolumeClaim:
        claimName: gradle-7.0-ro-dep-cache-rox
        readOnly: false