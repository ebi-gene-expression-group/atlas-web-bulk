name: Build WAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-war:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build WAR
        run: ./gradlew --no-daemon clean :app:war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gxa-war
          path: webapps/gxa.war
