# One-off job to populate gradle-7.0-ro-dep-cache-rox on hh-webadmin-35.
#
# The PVC is mounted where Gradle writes caches (/home/gradle/.gradle/caches).
# Jenkins pods mount the same PVC read-only at /gradle-ro-dep-cache (GRADLE_RO_DEP_CACHE).
#
# Apply:  kubectl delete job gradle-ro-dep-cache-seed -n gxa-jenkins --ignore-not-found
#         kubectl apply -f jenkins/gradle-ro-dep-cache-seed-job.yaml
# Watch:  kubectl logs -n gxa-jenkins -f job/gradle-ro-dep-cache-seed
apiVersion: batch/v1
kind: Job
metadata:
  name: gradle-ro-dep-cache-seed
  namespace: gxa-jenkins
  labels:
    app.kubernetes.io/name: gxa-jenkins
    app.kubernetes.io/component: gradle-cache-seed
    app.kubernetes.io/managed-by: atlas-web-bulk
    atlas.ebi.ac.uk/jenkins-integration: fg-public
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gxa-jenkins
        app.kubernetes.io/component: gradle-cache-seed
        app.kubernetes.io/managed-by: atlas-web-bulk
        atlas.ebi.ac.uk/jenkins-integration: fg-public
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: gradle:7.0-jdk11
          command:
            - bash
            - -c
            - |
              set -euxo pipefail
              # ebi-proxy ConfigMap (envFrom): HTTP_PROXY, NO_PROXY. Java needs system properties.
              proxy_host="${HTTP_PROXY#*://}"
              proxy_host="${proxy_host%%:*}"
              proxy_port="${HTTP_PROXY##*:}"
              export JAVA_TOOL_OPTIONS="-Dhttp.proxyHost=${proxy_host} -Dhttp.proxyPort=${proxy_port} -Dhttps.proxyHost=${proxy_host} -Dhttps.proxyPort=${proxy_port} -Dhttp.nonProxyHosts=${NO_PROXY//,/|}"
              git clone --recurse-submodules --depth 1 -b develop \
                https://github.com/ebi-gene-expression-group/atlas-web-bulk.git /work
              cd /work
              # Image ships Gradle 7.0 — no wrapper zip download needed.
              gradle --no-daemon --info \
                :atlas-web-core:compileJava \
                :atlas-web-core:compileTestJava \
                :app:compileJava \
                :app:compileTestJava \
                :cli:compileJava
              test -d /home/gradle/.gradle/caches/modules-2
              echo "Seeded $(find /home/gradle/.gradle/caches/modules-2 -type f | wc -l) files under modules-2"
          envFrom:
            - configMapRef:
                name: ebi-proxy
          env:
            - name: GRADLE_OPTS
              value: "-Dorg.gradle.daemon=false"
          volumeMounts:
            - name: gradle-ro-dep-cache
              mountPath: /home/gradle/.gradle/caches
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: gradle-ro-dep-cache
          persistentVolumeClaim:
            claimName: gradle-7.0-ro-dep-cache-rox
