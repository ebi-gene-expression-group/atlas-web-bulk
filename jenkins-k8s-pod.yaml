apiVersion: v1
kind: Pod
metadata:
  namespace: gxa-jenkins
spec:
  serviceAccountName: jenkins-cloud
  # If we set workspaceVolume dynamicPVC() or workspaceVolume persistentVolumeClaimWorkspaceVolume() we need to add a
  # fsGroup 1000 to make the /home/jenkins/agent directory writable. Otherwise, we get the following exception in the
  # jnlp container:
  # Exception in thread "main" java.io.IOException: The specified working directory should be fully accessible to the remoting executable (RWX): /home/jenkins/agent
  # The securityContext in the pod is inherited, as it becomes the default pod template
  securityContext:
    fsGroup: 1000
  containers:
    - name: jnlp
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    - name: openjdk
      image: eclipse-temurin:11
      resources:
        requests:
          memory: "2.5Gi"
          cpu: "1"
          ephemeral-storage: "4Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
      env:
      - name: GRADLE_OPTS
        value: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"
      command: [ "/bin/sh" ]
      args: [ "-c", "mkdir -p /root/expdesign-rw && cp /test-data/expdesign/* /root/expdesign-rw ; sleep 2h" ]
      volumeMounts:
        - mountPath: /test-data/gxa/magetab
          name: services-volume
          subPath: fg/atlas/environments/ci/experiments
          readOnly: true
        - mountPath: /test-data/expdesign
          name: services-volume
          subPath: fg/atlas/environments/ci/expdesign
          readOnly: true
        - mountPath: /test-data/ontology
          name: services-volume
          subPath: fg/atlas/ontology
          readOnly: true
        - mountPath: /test-data/bioentity_properties
          name: services-volume
          subPath: fg/atlas/bioentity_properties/gxa
          readOnly: true
    - name: postgres
      image: postgres:16-alpine
      resources:
        requests:
          memory: "100Mi"
        limits:
          memory: "200Mi"
          cpu: "1"
      env:
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests:
          memory: "1Gi"
        limits:
          memory: "2Gi"
          cpu: "1"
  volumes:
    - name: services-volume
      nfs:
        server: hh-isi-srv-vlan1496.ebi.ac.uk
        path: /ifs/public/services
