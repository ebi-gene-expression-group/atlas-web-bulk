apiVersion: v1
kind: Pod
metadata:
  namespace: gxa-jenkins
spec:
  serviceAccountName: jenkins-cloud
  # If we set workspaceVolume dynamicPVC() or workspaceVolume persistentVolumeClaimWorkspaceVolume() we need to add a
  # fsGroup 1000 to make the /home/jenkins/agent directory writable. Otherwise, we get the following exception in the
  # jnlp container:
  # Exception in thread "main" java.io.IOException: The specified working directory should be fully accessible to the remoting executable (RWX): /home/jenkins/agent
  # The securityContext in the pod is inherited, as it becomes the default pod template
  securityContext:
    fsGroup: 1000
    supplementalGroups: [1146]
  initContainers:
    # Fail fast if the codon snapshot path is missing.
    - name: init-experiments-snapshot
      image: busybox:1.28.0-glibc
      securityContext:
        runAsUser: 2921
        runAsGroup: 1146
      command: ["sh"]
      args:
        - "-c"
        - |
          set -e
          EXPERIMENTS_SOURCE_DIR="/atlas-data/gxa_codon/.snapshot/gxa_codon_2025-10-14_13:34/experiments"
          if [ ! -d "$EXPERIMENTS_SOURCE_DIR" ]; then
            echo "ERROR: experimentsSourceDir does not exist: $EXPERIMENTS_SOURCE_DIR" >&2
            exit 1
          fi
          echo "Experiments snapshot present: $(ls -d "$EXPERIMENTS_SOURCE_DIR"/E-* 2>/dev/null | wc -l) experiments"
      volumeMounts:
        - name: codon-volume
          mountPath: /atlas-data/gxa_codon
          readOnly: true
    # gradlew downloads the wrapper zip via Java HTTPS proxy; EBI cache often returns
    # 503 on CONNECT while curl -x works. Seed the shared wrapper PVC once per cluster.
    - name: init-gradle-wrapper
      image: curlimages/curl:8.5.0
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      envFrom:
        - configMapRef:
            name: ebi-proxy
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          URL='https://services.gradle.org/distributions/gradle-7.0-bin.zip'
          HASH=$(printf '%s' "$URL" | sha256sum | awk '{print $1}')
          DEST="/tmp/gradle/wrapper/dists/gradle-7.0-bin/${HASH}"
          ZIP="${DEST}/gradle-7.0-bin.zip"
          mkdir -p "${DEST}"
          if [ -s "${ZIP}" ]; then
            echo "Gradle wrapper zip cached: ${ZIP} ($(wc -c < "${ZIP}") bytes)"
            exit 0
          fi
          PROXY="${HTTP_PROXY:-http://hx-wwwcache.ebi.ac.uk:3128}"
          echo "Downloading Gradle wrapper via curl (${PROXY})..."
          curl -fsSL -x "${PROXY}" -L --retry 3 --retry-delay 5 -o "${ZIP}.part" "${URL}"
          mv "${ZIP}.part" "${ZIP}"
          echo "Cached ${ZIP} ($(wc -c < "${ZIP}") bytes)"
      volumeMounts:
        - name: gradle-wrapper-cache
          mountPath: /tmp/gradle/wrapper
  containers:
    - name: jnlp
      envFrom:
        - configMapRef:
            name: ebi-proxy
      resources:
        requests:
          memory: "512Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    - name: openjdk
      image: eclipse-temurin:11
      # Match jnlp workspace ownership (uid 1000). Codon NFS readable via pod
      # supplementalGroups fg_atlas (1146).
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      resources:
        requests:
          memory: "2.5Gi"
          cpu: "500m"
          ephemeral-storage: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      envFrom:
        - configMapRef:
            name: ebi-proxy
      env:
      # gradlew passes GRADLE_OPTS to java via unquoted eval; proxy host/port here
      # (no pipes). http.nonProxyHosts with | belongs in JAVA_TOOL_OPTIONS only.
      - name: GRADLE_OPTS
        value: >-
          -Dorg.gradle.daemon=false
          -Dorg.gradle.workers.max=4
          -Dhttp.proxyHost=hx-wwwcache.ebi.ac.uk
          -Dhttp.proxyPort=3128
          -Dhttps.proxyHost=hx-wwwcache.ebi.ac.uk
          -Dhttps.proxyPort=3128
      - name: GRADLE_USER_HOME
        value: "/tmp/gradle"
      - name: GRADLE_RO_DEP_CACHE
        value: "/gradle-ro-dep-cache"
      - name: npm_config_cache
        value: "/npm-cache"
      - name: JAVA_TOOL_OPTIONS
        value: >-
          -Dhttp.proxyHost=hx-wwwcache.ebi.ac.uk
          -Dhttp.proxyPort=3128
          -Dhttps.proxyHost=hx-wwwcache.ebi.ac.uk
          -Dhttps.proxyPort=3128
          -Dhttp.nonProxyHosts=localhost|127.0.0.1|dockerhub.ebi.ac.uk|.ebi.ac.uk|*.cluster.local|*.svc|*.svc.cluster.local|kubernetes.default|*.gxa-ci-solrcloud|*.gxa-jenkins
      command: [ "/bin/sh" ]
      args: [ "-c", "mkdir -p /tmp/gradle /tmp/expdesign-rw && cp /test-data/expdesign/* /tmp/expdesign-rw/ ; sleep 2h" ]
      volumeMounts:
        - mountPath: /test-data/gxa/magetab
          name: codon-volume
          subPath: .snapshot/gxa_codon_2025-10-14_13:34/experiments
          readOnly: true
        - mountPath: /atlas-data/gxa_codon
          name: codon-volume
          readOnly: true
        - mountPath: /test-data/expdesign
          name: services-volume
          subPath: fg/atlas/environments/ci/expdesign
          readOnly: true
        - mountPath: /test-data/ontology
          name: services-volume
          subPath: fg/atlas/ontology
          readOnly: true
        - mountPath: /test-data/bioentity_properties
          name: services-volume
          subPath: fg/atlas/bioentity_properties
          readOnly: true
        - mountPath: /gradle-ro-dep-cache
          name: gradle-ro-dep-cache
          readOnly: true
        - mountPath: /tmp/gradle/wrapper
          name: gradle-wrapper-cache
        - mountPath: /npm-cache
          name: npm-ci-cache
        - name: codon-volume
          mountPath: /test-data/gxa/release-metadata.json
          subPath: release-metadata.json
          readOnly: true
        - name: codon-volume
          mountPath: /test-data/gxa/species-properties.json
          subPath: species-properties.json
          readOnly: true

    # Root only for apt/nvm and front-end native builds (gcc, libglu1-mesa).
    - name: node-build
      image: eclipse-temurin:11
      securityContext:
        runAsUser: 0
      envFrom:
        - configMapRef:
            name: ebi-proxy
      env:
      - name: npm_config_cache
        value: "/npm-cache"
      command: [ "/bin/sh", "-c", "sleep 2h" ]
      resources:
        requests:
          memory: "2Gi"
          cpu: "200m"
        limits:
          memory: "4Gi"
          cpu: "1"
      volumeMounts:
        - mountPath: /npm-cache
          name: npm-ci-cache

    - name: postgres
      image: postgres:16-alpine
      resources:
        requests:
          memory: "100Mi"
        limits:
          memory: "200Mi"
      env:
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      securityContext:
        runAsUser: 0
      command: ["/busybox/cat"]
      tty: true
      envFrom:
        - configMapRef:
            name: ebi-proxy
      resources:
        requests:
          memory: "2Gi"
          cpu: "200m"
        limits:
          memory: "4Gi"
          cpu: "1"
          ephemeral-storage: "8Gi"
  volumes:
    - name: codon-volume
      nfs:
        server: hh-isi-srv-vlan1496.ebi.ac.uk
        path: /ifs/public/ro/gxa_codon
    - name: services-volume
      nfs:
        server: hh-isi-srv-vlan1496.ebi.ac.uk
        path: /ifs/public/services
    - name: gradle-ro-dep-cache
      persistentVolumeClaim:
        claimName: gradle-7.0-ro-dep-cache-rox
        readOnly: true
    - name: gradle-wrapper-cache
      persistentVolumeClaim:
        claimName: gradle-wrapper-cache-rwx
    - name: npm-ci-cache
      persistentVolumeClaim:
        claimName: npm-ci-cache-rwx
